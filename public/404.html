<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>wms-claude-code</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a deep link (or a
      // refresh on a client-side route) 404s. This re-encodes the path into
      // a query string and redirects to index.html, which decodes it back
      // via the matching script in index.html. Standard spa-github-pages trick.
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
